name: Docstring coverage

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  doc-coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y doxygen graphviz python3 python3-xml

      - name: Build Doxygen XML
        run: |
          if [ ! -f Doxyfile ]; then echo "Doxyfile not found in repo root"; exit 1; fi
          # Ensure XML output enabled by overriding environment variable in Doxygen. If Doxyfile lacks GENERATE_XML=YES,
          # set it via a temporary Doxyfile fragment.
          cat > /tmp/doxy_override <<'EOF'
          GENERATE_XML = YES
          XML_OUTPUT = doc/xml
EOF
          doxygen Doxyfile /tmp/doxy_override

      - name: Compute coverage
        run: |
          python3 tools/doc_coverage.py --xml-dir doc/xml --threshold 80
