name: test

on:
  pull_request:
    branches: [ "main" ]
    paths:
      - '**.c'
      - '**.cpp'
      - '**.h'
      - '**.hpp'

jobs:
  format:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      commit_sha: ${{ steps.auto-commit.outputs.commit_hash }}

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true

      - name: Install clang-format-22
        run: |
          python -m pip install --user clang-tools
          TOOL_BIN="$HOME/.local/bin"
          echo "$TOOL_BIN" >> "$GITHUB_PATH"
          export PATH="$TOOL_BIN:$PATH"
          clang-tools install clang-format --version 22 --directory "$TOOL_BIN"

      - name: Run clang-format
        run: |
          git ls-files -z '*.cpp' '*.hpp' '*.h' '*.c' | xargs -0 -r clang-format -i

      - name: Commit and push changes
        id: auto-commit
        if: github.actor != 'github-actions[bot]' && github.event.pull_request.head.repo.full_name == github.repository
        uses: stefanzweifel/git-auto-commit-action@04702edda442b2e678b25b537cec683a1493fcb9
        with:
          commit_message: "style: apply clang-format-22"

  build:
    needs: format
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest]
        build_type: [Debug, Release]
        cpp_compiler: [g++, clang++, cl]
        error_mode: [ASSERT, THROW, NONE]

        exclude:
          - os: ubuntu-latest
            cpp_compiler: cl
          - build_type: Release
            error_mode: ASSERT
            
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      - name: Set build dir
        id: vars
        shell: bash
        run: echo "dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"

      - name: Configure CMake
        shell: bash
        run: |
          if [[ "${{ matrix.os }}" == "ubuntu-latest" ]]; then
            if [[ "${{ matrix.cpp_compiler }}" == "clang++" ]]; then
              SANITIZERS="memory,undefined"
            else
              SANITIZERS="address,undefined"
            fi
          fi
          cmake -B "${{ steps.vars.outputs.dir }}" \
                -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }} \
                -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
                -DSANITIZERS=${SANITIZERS} \
                -DCHESSLIB_ERROR_MODE=${{ matrix.error_mode }} \
                -DDART_TESTING_TIMEOUT=0 \
                -S "${{ github.workspace }}"

      - name: Build
        run: cmake --build ${{ steps.vars.outputs.dir }} --config ${{ matrix.build_type }}

      - name: Test  
        working-directory: ${{ steps.vars.outputs.dir }}
        shell: bash
        run: |
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            ctest --build-config ${{ matrix.build_type }} --verbose -j 4 --timeout 0
          else
            ctest --verbose -j 4 --timeout 0
          fi
